name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Ruff + mypy + pytest: the contract tests start the real service and a deliberately wrong one.
  python:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.12" # same as the image
      # mypy runs from [tool.mypy]. Ratchet: measured 76.43% on 2026-10-22
      # (ADR-0004: threshold = measured, rounded down).
      coverage-threshold: "76"
  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the image (not pushed)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          load: true
          tags: cloud-benchmark:ci
      - name: Contract against the container
        run: |
          docker run -d --name cb -p 8080:8080 -e BENCH_TARGET=container cloud-benchmark:ci
          python3 - <<'PY'
          import sys, time, urllib.request
          sys.path.insert(0, ".")
          from contract.check import check
          for _ in range(60):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=1); break
              except OSError:
                  time.sleep(1)
          result = check("http://127.0.0.1:8080", expected_target="container")
          print("\n".join(result.failures) or "contract ok")
          sys.exit(0 if result.ok else 1)
          PY
      - name: Container logs
        if: failure()
        run: docker logs cb
