[project]
name = "cloud-benchmark"
version = "0.1.0"
description = "Deploy one service to several PaaS targets, measure them the same way, then tear them down."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
# The service's own dependencies. The Dockerfile installs only this group
# (exported to app/requirements.txt), so the runner and tests stay out of the image.
app = ["fastapi", "uvicorn"]
dev = ["pytest", "ruff", "httpx"]

[tool.uv]
default-groups = ["app", "dev"]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# The runner and tests talk to URLs the operator gives them and run subprocesses on purpose.
"runner/*" = ["S310", "S603", "S607"]
"tests/*" = ["S310", "S603", "S607"]
"contract/*" = ["S310"]
"targets/*" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
